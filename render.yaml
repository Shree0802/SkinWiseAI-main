services:
  - type: web
    name: skinwise-ai-backend
    env: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: SkinWise AI
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: API_V1_PREFIX
        value: /api/v1
      - key: YOUCAM_API_KEY
        sync: false
      - key: YOUCAM_API_BASE_URL
        value: https://yce-api-01.makeupar.com
      - key: YOUCAM_POLL_INTERVAL
        value: "1.5"
      - key: YOUCAM_POLL_TIMEOUT
        value: "60.0"
      - key: ALLOW_DEMO_FALLBACK
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///./skinwise.db
      - key: CORS_ORIGINS
        value: https://skin-wise-ai-main.vercel.app,http://localhost:5173,http://127.0.0.1:5173
